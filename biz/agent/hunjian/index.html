<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>混剪工作台</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff6a28'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<aside class="side">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="#fff"/></svg></span>混剪工作台</div>
  <nav>
    <a data-view="gen" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/></svg>批量生成</a>
    <a data-view="lib"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>成片库<em id="libCount"></em></a>
    <a data-view="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>发布排程</a>
    <a class="dim"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="4"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6M17 7a3 3 0 010 6M19 14c2 1 3 3 3 6"/></svg>账号矩阵</a>
    <a class="dim"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>素材库</a>
  </nav>
  <div class="shop"><span class="av">柚</span><div><b>半山柚茶</b><small>滨江店 · 4 个账号</small></div></div>
</aside>

<main>
  <!-- 批量生成 -->
  <section id="gen" class="view on">
    <header><h1>批量生成</h1><span class="sub">素材进来，成片出去</span></header>
    <div class="cols">
      <div class="left">
        <div class="card">
          <div class="card-h"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            <b id="folderPath">素材文件夹</b><span class="muted" id="folderMeta"></span></div>
          <div class="tiles" id="tiles"></div>
          <div class="bgm" id="bgm"></div>
        </div>
        <div class="card strip-card">
          <div class="card-h"><b>本次成片</b><span class="muted" id="stripMeta">还没开始</span></div>
          <div class="strip-body"><div class="latest" id="latest"><span>成片会在这里预览</span></div><div class="strip" id="strip"></div></div>
        </div>
      </div>
      <div class="right">
        <div class="card form" id="form">
          <label>门店 / 商品</label>
          <input id="product" value="半山柚茶">
          <label>卖点（逗号隔开）</label>
          <textarea id="points" rows="3" placeholder="比如：整颗西柚现剥、第二杯半价"></textarea>
          <label>生成数量</label>
          <div class="seg" id="segN"><button data-v="5">5 条</button><button data-v="10" class="on">10 条</button><button data-v="20" class="lock">20 条</button></div>
          <label>单条时长</label>
          <div class="seg" id="segS"><button data-v="10">10 秒</button><button data-v="12" class="on">12 秒</button><button data-v="15">15 秒</button></div>
          <label>去重处理</label>
          <div class="chips" id="opts">
            <span data-k="shuffle" class="on">打乱镜头</span><span data-k="speed" class="on">随机变速</span>
            <span data-k="mirror" class="on">镜像翻转</span><span data-k="crop" class="on">裁边缩放</span>
            <span data-k="color" class="on">微调色</span><span data-k="bgm_offset" class="on">换音乐起点</span>
          </div>
          <button class="primary" id="go"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z" fill="currentColor"/></svg><span>一键生成 10 条</span></button>
        </div>
        <div class="card run" id="run" hidden>
          <div class="run-h"><b id="runTitle">正在生成</b><span id="runPct">0%</span></div>
          <div class="bar"><i id="runBar"></i></div>
          <ul class="steps" id="steps">
            <li data-s="scan">扫描素材</li><li data-s="slice">镜头切片</li><li data-s="copy">写标题和字幕</li>
            <li data-s="render">合成成片 <em id="renderN"></em></li><li data-s="check">去重自检</li>
          </ul>
          <div class="console" id="console"></div>
          <div class="run-done" id="runDone" hidden>
            <button class="ghost" id="again">改设置</button><button class="ghost" data-goto="lib">查看成片</button><button class="primary sm" data-goto="plan">去排程</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 成片库 -->
  <section id="lib" class="view">
    <header><h1>成片库</h1><div class="stats" id="libStats"></div></header>
    <div class="lib-wrap">
      <div class="grid" id="grid"></div>
      <div class="card matrix"><div class="card-h"><b>去重检测</b><span class="muted" id="mxSum"></span></div>
        <div class="mx" id="mx"></div><div class="mx-legend"><span>不像</span><i></i><span>很像</span></div><p class="mx-note" id="mxNote"></p></div>
    </div>
  </section>

  <!-- 发布排程 -->
  <section id="plan" class="view">
    <header><h1>发布排程</h1>
      <div class="plan-ctl"><span class="clock"><i></i>今天 <b id="clock">11:00</b></span>
        <span class="muted" id="planSum"></span>
        <button class="primary sm" id="startPub">开始自动发布</button></div></header>
    <div class="plan-wrap">
      <div class="card tl">
        <div class="tl-head"><div class="acc-col"></div><div class="hours" id="hours"></div></div>
        <div id="rows"></div>
      </div>
      <div class="card feed"><div class="card-h"><b>发布动态</b></div><ul id="feed"><li class="empty">到点后这里会显示发布结果</li></ul></div>
    </div>
  </section>
</main>
<div class="modal" id="modal" hidden><div class="card detail" id="detail"></div></div>
<div class="toast" id="toast"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body></html>
