<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>数据日报助手</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8692c'/%3E%3Cpath d='M9 23V15M14 23V9M19 23v-6M24 23v-9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="./style.css"></head>
<body>
<aside class="left">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div><b>数据日报助手</b><small>半山柚茶 · 3 家门店</small></div></div>
  <div class="card src">
    <div class="card-h"><b>数据来源</b><span class="muted" id="srcDate"></span></div>
    <ul id="files"></ul>
  </div>
  <div class="card sch">
    <div class="card-h"><b>定时推送</b><span class="sw on" id="sw"><i></i></span></div>
    <div class="sch-row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>每天 <b id="schTime">09:00</b> 整理前一天的数据</div>
    <div class="sch-row"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>发到 <b id="schGroup"></b></div>
    <div class="sch-next">下次：<span id="schNext"></span></div>
    <button class="primary" id="run"><svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg><span>立即跑一次</span></button>
  </div>
</aside>

<main>
  <nav class="tabs" id="tabs"><a data-t="raw" class="on">原始数据</a><a data-t="clean">清洗结果</a><a data-t="report">日报</a><a data-t="chat" class="mob">店长群</a></nav>
  <section class="pane on" id="raw"><div class="raw-h"><b id="rawName"></b><span class="muted" id="rawMeta"></span></div><div class="grid" id="rawGrid"></div></section>
  <section class="pane" id="clean">
    <div class="sum" id="sum"></div>
    <div class="tbl"><table id="cleanTbl"></table><div class="muted empty" id="cleanEmpty">点「立即跑一次」，这里显示清洗后的订单</div></div>
  </section>
  <section class="pane" id="report"><div class="rep-acts" id="repActs" hidden><span class="muted">日报_2026-11-25.png · 点图片看大图</span><a class="ghost" href="./report_1125.jpg" download="日报_2026-11-25.jpg">下载日报图片</a></div><div class="rep-wrap"><div class="rep" id="rep"><div class="muted empty">跑完一次就能看到日报</div></div></div></section>
  <div class="run-card" id="runCard" hidden>
    <div class="run-h"><b id="runTitle">正在整理 11月25日 的数据</b><span id="runPct">0%</span></div>
    <div class="bar"><i id="runBar"></i></div>
    <ol class="steps" id="steps">
      <li data-s="read">读取 4 个文件，认表头、截图识字</li><li data-s="calc">统一格式、去重、剔除测试单和退款</li>
      <li data-s="write">汇总指标，和前一天对比</li><li data-s="render">写小结，生成日报</li><li data-s="push">推送到群</li>
    </ol>
    <div class="console" id="console"></div>
  </div>
</main>

<aside class="chat">
  <div class="chat-h"><b id="groupName"></b><small>8 人</small></div>
  <div class="msgs" id="msgs"></div>
  <div class="chat-in"><span>发消息…</span></div>
</aside>
<div class="modal" id="modal" hidden><img id="modalImg" alt=""></div>
<div class="toast" id="toast"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body></html>
