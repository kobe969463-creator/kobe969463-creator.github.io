<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>图文工坊</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8573a'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css"></head>
<body>
<aside class="panel">
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>图文工坊</div>
  <label>商品名称</label>
  <input id="product" value="屿光轻行保温杯 480ml">
  <label>核心卖点 <small>用顿号隔开</small></label>
  <textarea id="points" rows="3">316 不锈钢内胆、保温 12 小时、单手一键弹盖、只有 260 克、杯口大能放冰块</textarea>
  <label>商品图 <small id="imgN"></small></label>
  <div class="imgs" id="imgs"></div><input type="file" id="addImg" accept="image/*" hidden>
  <label>笔记角度</label>
  <div class="chips" id="styles"><span class="on">真实分享</span><span class="on">测评对比</span><span class="on">清单种草</span><span class="on">场景故事</span></div>
  <label>生成篇数</label>
  <div class="seg" id="segN"><button data-v="4">4 篇</button><button data-v="8" class="on">8 篇</button><button data-v="12" class="lock">12 篇</button></div>
  <button class="primary" id="go"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z" fill="currentColor"/></svg><span>批量生成 8 篇</span></button>
</aside>
<main>
  <header>
    <div><h1>生成结果</h1><p class="status" id="status">填好左边，点「批量生成」</p></div>
    <div class="acts"><button class="ghost" id="zipBtn" disabled><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>下载全部封面</button>
      <button class="ghost strong" id="xlsBtn" disabled><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>导出表格</button></div>
  </header>
  <div class="bar" id="bar" hidden><i id="barI"></i></div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body></html>
